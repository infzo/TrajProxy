<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tokenizer Tool — Chat Messages / Prompt / Token IDs 三向转换</title>
<style>
/* ==================== Design tokens ==================== */
:root {
  --bg-body: #f8fafc;
  --bg-panel: #ffffff;
  --bg-subtle: #f1f5f9;
  --bg-hover: #f1f5f9;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-muted: #475569;
  --text-dim: #94a3b8;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --primary-soft: #eef2ff;
  --primary-ring: rgba(99, 102, 241, 0.18);
  --danger: #ef4444;
  --success: #10b981;
  --warning: #f59e0b;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
  --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 4px -1px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 12px 32px -8px rgba(15, 23, 42, 0.12);
  --font-mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans); font-size: 13px; line-height: 1.5; color: var(--text);
  background: var(--bg-body); display: flex; flex-direction: column; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid var(--bg-body); }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* ==================== App header ==================== */
.app-header {
  height: 56px; flex-shrink: 0;
  background: rgba(255,255,255,0.78); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 50;
}
.brand { font-weight: 700; font-size: 16px; letter-spacing: -0.5px; color: var(--text); display: flex; align-items: center; gap: 9px; }
.brand .mark { color: var(--primary); font-size: 14px; line-height: 1; }
.brand .sub { font-weight: 500; font-size: 12px; color: var(--text-dim); margin-left: 4px; padding-left: 12px; border-left: 1px solid var(--border); }
.brand .sub b { color: var(--text-muted); font-weight: 600; }
.status-pill {
  display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500;
  color: var(--text-muted); padding: 5px 12px; border-radius: 999px;
  background: var(--bg-subtle); border: 1px solid var(--border);
  max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
.status-pill.ok { color: #047857; background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.25); }
.status-pill.ok .dot { background: var(--success); }
.status-pill.error { color: #b91c1c; background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.25); }
.status-pill.error .dot { background: var(--danger); }

/* ==================== Toolbar ==================== */
.toolbar {
  display: flex; align-items: center; gap: 10px; padding: 10px 20px;
  background: var(--bg-panel); border-bottom: 1px solid var(--border);
  flex-shrink: 0; flex-wrap: wrap; min-height: 48px;
}
.toolbar select, .toolbar input[type="text"] {
  font-family: var(--font-sans); font-size: 13px; background: var(--bg-panel); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; outline: none;
  transition: border-color .15s, box-shadow .15s; height: 32px;
}
.toolbar select { cursor: pointer; }
.toolbar select:focus, .toolbar input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); }
.toolbar #modelPreset { max-width: 220px; }
.toolbar input[type="text"] { flex: 1; min-width: 200px; max-width: 460px; }
button { cursor: pointer; border: none; font-family: inherit; transition: all .15s ease; }
.btn-primary {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--primary); color: #fff; border: 1px solid var(--primary);
  border-radius: var(--radius-sm); padding: 6px 14px; font-size: 13px; font-weight: 500;
  white-space: nowrap; height: 32px;
}
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); box-shadow: var(--shadow-md); }
.btn-primary:disabled { background: var(--text-dim); border-color: var(--text-dim); cursor: not-allowed; box-shadow: none; }
.btn-secondary {
  display: inline-flex; align-items: center; gap: 5px;
  background: transparent; color: var(--text-muted); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 5px 10px; font-size: 12px; white-space: nowrap; height: 28px;
}
.btn-secondary:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg-hover); }
.toolbar .sep { width: 1px; height: 22px; background: var(--border); margin: 0 3px; }

/* ==================== Main panels ==================== */
.main { display: flex; flex: 1; min-height: 0; background: var(--border); gap: 1px; overflow: hidden; }
.panel { flex: 1; display: flex; flex-direction: column; background: var(--bg-panel); min-width: 0; }
.panel-header {
  display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; gap: 10px;
  background: var(--bg-subtle); border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.panel-header .title-group { display: flex; align-items: center; gap: 8px; min-width: 0; }
.panel-header h3 { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
.panel-header .count-badge {
  font-size: 11px; font-weight: 600; color: var(--primary); background: var(--primary-soft);
  border: 1px solid rgba(99,102,241,0.2); padding: 1px 8px; border-radius: 999px;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.panel-header .actions { display: flex; gap: 5px; flex-shrink: 0; }
.panel-header .actions .btn-secondary { height: 26px; padding: 4px 9px; font-size: 11px; }
.panel-body { flex: 1; overflow: auto; padding: 12px; position: relative; background: var(--bg-panel); }
.panel-body textarea {
  width: 100%; height: 100%; min-height: 300px; background: transparent; color: var(--text);
  border: none; resize: none; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.65;
  outline: none; tab-size: 2;
}
.panel-body textarea::placeholder { color: var(--text-dim); }

/* ==================== Token 面板（可编辑 ID + 只读芯片网格） ==================== */
#tokenPanel .panel-body { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
#tokenIdsEditor {
  flex: 0 0 auto; width: 100%; min-height: 96px; max-height: 180px; resize: vertical;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.6; color: var(--text);
  background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 10px; outline: none; transition: border-color .15s, box-shadow .15s;
}
#tokenIdsEditor:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); background: var(--bg-panel); }
.token-chips-wrap { flex: 1; min-height: 120px; overflow: auto; }
.token-hint { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }

.token-display { display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; }
.token-chip {
  display: inline-flex; flex-direction: column; align-items: center; padding: 3px 7px 4px;
  border-radius: var(--radius-sm); font-family: var(--font-mono); min-width: 30px; text-align: center;
  background: var(--bg-panel); border: 1px solid var(--border); border-top-width: 2px;
  border-top-color: var(--border-strong); cursor: default; user-select: all;
  transition: border-color .12s, box-shadow .12s, transform .12s;
}
.token-chip:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.token-chip .token-id { font-size: 9.5px; color: var(--text-dim); line-height: 1.2; font-variant-numeric: tabular-nums; }
.token-chip .token-text { font-size: 12px; color: var(--text); line-height: 1.3; }
.token-chip.special { border-color: var(--primary); border-top-color: var(--primary); background: var(--primary-soft); }
.token-chip.special .token-id { color: var(--primary); font-weight: 600; }
.token-chip.special .token-text { color: var(--primary-hover); }
.token-chip.group-a { border-top-color: #fca5a5; }
.token-chip.group-b { border-top-color: #93c5fd; }
.token-chip.group-c { border-top-color: #86efac; }
.token-chip.group-d { border-top-color: #fcd34d; }

/* ==================== Toast ==================== */
#toastContainer { position: fixed; bottom: 24px; right: 24px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--bg-panel); color: var(--text); border: 1px solid var(--border);
  border-left: 3px solid var(--primary); padding: 10px 16px; border-radius: var(--radius-md);
  font-size: 13px; box-shadow: var(--shadow-md); max-width: 400px; animation: toastIn .25s ease;
}
.toast.error { border-left-color: var(--danger); }
.toast.success { border-left-color: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ==================== File drop overlay ==================== */
.drop-overlay {
  display: none; position: fixed; inset: 12px; z-index: 999;
  background: rgba(248,250,252,0.9); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  align-items: center; justify-content: center;
  border: 3px dashed var(--primary); border-radius: var(--radius-lg);
}
.drop-overlay.active { display: flex; }
.drop-overlay span { font-size: 18px; color: var(--primary); font-weight: 600; }

.empty-state { color: var(--text-dim); padding: 28px; text-align: center; font-size: 12px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  .token-chip:hover { transform: none; }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="mark">◆</span> Tokenizer
    <span class="sub"><b>Messages</b> ↔ <b>Prompt</b> ↔ <b>Token IDs</b></span>
  </div>
  <span id="status" class="status-pill"><span class="dot"></span><span class="status-text">就绪 — 请加载模型 Tokenizer</span></span>
</header>

<div class="toolbar">
  <select id="sourceType" title="文件来源">
    <option value="modelscope" selected>ModelScope</option>
    <option value="huggingface">HuggingFace</option>
    <option value="local">本地文件</option>
  </select>
  <select id="modelPreset" title="快捷选择常见模型（自动匹配正确来源）">
    <option value="">— 快捷选择模型 —</option>
    <option value="ms|deepseek-ai/DeepSeek-V4-Pro">DeepSeek V4 Pro · ModelScope</option>
    <option value="hf|deepseek-ai/DeepSeek-V4-Pro">DeepSeek V4 Pro · HuggingFace</option>
    <option value="ms|Qwen/Qwen2.5-7B-Instruct">Qwen2.5 7B Instruct · ModelScope</option>
    <option value="hf|Qwen/Qwen2.5-7B-Instruct">Qwen2.5 7B Instruct · HuggingFace</option>
    <option value="ms|Qwen/Qwen3.5-35B-A3B">Qwen3.5 35B MoE · ModelScope</option>
    <option value="ms|Qwen/Qwen3.6-35B-A3B">Qwen3.6 35B MoE · ModelScope</option>
    <option value="ms|ZhipuAI/GLM-5.2">GLM 5.2 · ModelScope</option>
    <option value="hf|zai-org/GLM-5.2">GLM 5.2 · HuggingFace</option>
  </select>
  <input type="text" id="modelPath" placeholder="Qwen/Qwen2.5-7B-Instruct 或 qwen/Qwen2.5-7B-Instruct" value="qwen/Qwen2.5-7B-Instruct">
  <button id="btnLoad" class="btn-primary" title="加载 Tokenizer & Chat Template">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    加载
  </button>
  <span class="sep"></span>
  <button id="btnSampleChat" class="btn-secondary" title="加载示例对话">示例对话</button>
  <button id="btnSampleSingle" class="btn-secondary" title="加载示例单轮">示例单轮</button>
</div>

<div class="main">
  <!-- Panel 1: Chat Messages -->
  <div class="panel">
    <div class="panel-header">
      <div class="title-group"><h3>Chat Messages</h3><span class="count-badge">JSON</span></div>
      <div class="actions">
        <button id="btnMessagesToPrompt" class="btn-secondary" title="Messages → Prompt">→ 应用模板</button>
      </div>
    </div>
    <div class="panel-body">
      <textarea id="messagesEditor" spellcheck="false" placeholder='[{"role":"system","content":"You are helpful."},{"role":"user","content":"Hello"}}]'>[
  {"role": "system", "content": "You are a helpful assistant."},
  {"role": "user", "content": "介绍一下深度学习。"}
]</textarea>
    </div>
  </div>

  <!-- Panel 2: Prompt String -->
  <div class="panel">
    <div class="panel-header">
      <div class="title-group"><h3>Prompt String</h3></div>
      <div class="actions">
        <button id="btnPromptToTokens" class="btn-secondary" title="Prompt → Token IDs">→ Tokenize</button>
        <button id="btnPromptToMessages" class="btn-secondary" title="Prompt → Messages（尝试解析）">← 解析</button>
      </div>
    </div>
    <div class="panel-body">
      <textarea id="promptEditor" placeholder="渲染后的完整 prompt 字符串..." spellcheck="false"></textarea>
    </div>
  </div>

  <!-- Panel 3: Token IDs（可编辑） -->
  <div class="panel" id="tokenPanel">
    <div class="panel-header">
      <div class="title-group"><h3>Token IDs</h3><span class="count-badge"><span id="tokenCount">0</span> tokens</span></div>
      <div class="actions">
        <button id="btnTokensToPrompt" class="btn-secondary" title="Token IDs → Prompt">← Detokenize</button>
        <button id="btnTokensToMessages" class="btn-secondary" title="Token IDs → Prompt → Messages">← 完整还原</button>
        <button id="btnCopyTokens" class="btn-secondary" title="复制 Token ID 列表">📋 复制</button>
      </div>
    </div>
    <div class="panel-body">
      <textarea id="tokenIdsEditor" spellcheck="false" placeholder="在此编辑 Token ID，用逗号/空格/换行分隔，如：101, 2003, 1037&#10;修改后点「← Detokenize」或稍候自动还原为文本"></textarea>
      <div class="token-hint">✎ 上方文本框可直接编辑 / 粘贴 ID；下方为只读可视化（Ġ=前导空格 ↵=换行）</div>
      <div class="token-chips-wrap"><div class="token-display" id="tokenChips"></div></div>
    </div>
  </div>
</div>

<div class="drop-overlay" id="dropOverlay"><span>释放文件以加载 Tokenizer</span></div>
<div id="toastContainer"></div>

<script src="https://unpkg.com/nunjucks@3.2.4/browser/nunjucks.min.js"></script>
<script>
// ============================================================
// 全局状态
// ============================================================
const state = {
  tokenizerReady: false,
  sourceType: 'modelscope',
  modelPath: 'qwen/Qwen2.5-7B-Instruct',
  vocab: null,
  idToToken: null,
  merges: null,
  mergeList: null,
  addedTokens: null,
  specialTokenIds: null,
  chatTemplate: null,
  eosToken: null,
  bosToken: null,
  byteEncoder: null,
  byteDecoder: null,
  pretokPattern: null,
  currentTokenIds: [],   // ★ 唯一权威 ID 数据源：Detokenize/复制只认这里，不再从 DOM 反解析
};

// ============================================================
// Byte-level BPE 映射表（GPT-2 标准）
// ============================================================
function buildByteMaps() {
  const bs = Array.from({ length: 256 }, (_, i) => String.fromCharCode(i));
  const cs = [...bs];
  let n = 0;
  const printableRanges = [[33, 126], [161, 172], [174, 255]];
  for (let b = 0; b < 256; b++) {
    const isPrintable = printableRanges.some(([lo, hi]) => b >= lo && b <= hi);
    if (!isPrintable) { cs[b] = String.fromCharCode(256 + n); n++; }
  }
  const unicodeToBytes = {};
  for (let b = 0; b < 256; b++) unicodeToBytes[cs[b]] = b;
  return { bytesToUnicode: cs, unicodeToBytes };
}
const BYTE_MAPS = buildByteMaps();
state.byteEncoder = BYTE_MAPS.bytesToUnicode;
state.byteDecoder = BYTE_MAPS.unicodeToBytes;
state.pretokPattern = new RegExp(
  "(?:'[sS]|'[tT]|'[rR][eE]|'[vV][eE]|'[mM]|'[lL][lL]|'[dD])" +
  "| ?\\p{L}+| ?\\p{N}+| ?[^\\s\\p{L}\\p{N}]+|\\s+(?!\\S)|\\s+",
  "gu"
);

// ============================================================
// 工具函数
// ============================================================
function textToBytes(text) { return new TextEncoder().encode(text); }
function bytesToText(bytes) { return new TextDecoder('utf-8', { fatal: false }).decode(bytes); }
function textToBpeStr(text) {
  return Array.from(textToBytes(text)).map(b => state.byteEncoder[b]).join('');
}
function bpeStrToText(bpeStr) {
  const byteArr = [];
  // ★ 必须用索引遍历（UTF-16 code unit），不能用 for...of（Unicode 码点）
  for (let i = 0; i < bpeStr.length; i++) {
    const b = state.byteDecoder[bpeStr[i]];
    if (b !== undefined) byteArr.push(b);
  }
  return bytesToText(new Uint8Array(byteArr));
}
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity .3s'; }, 2500);
  setTimeout(() => toast.remove(), 3000);
}
// ★ 状态胶囊统一写入（修复文字叠加）
function setStatus(kind, text) {
  const el = document.getElementById('status');
  el.className = 'status-pill' + (kind ? ' ' + kind : '');
  el.querySelector('.status-text').textContent = text;
}

// ============================================================
// BPE Tokenizer 实现
// ============================================================
function bpeMerge(word) {
  if (word.length <= 1) return [word];
  let chars = [...word];
  const pairMap = new Map();
  for (let i = 0; i < chars.length - 1; i++) {
    const p = chars[i] + ' ' + chars[i + 1];
    const rank = state.merges ? state.merges.get(p) : undefined;
    pairMap.set(i, { pair: p, rank: rank !== undefined ? rank : Infinity });
  }
  while (true) {
    let bestRank = Infinity, bestPair = null;
    for (const entry of pairMap.values()) {
      if (entry.rank < bestRank) { bestRank = entry.rank; bestPair = entry.pair; }
    }
    if (bestPair === null || bestRank === Infinity) break;
    const [a, b] = bestPair.split(' ');
    const newChars = [];
    let i = 0;
    while (i < chars.length) {
      if (i < chars.length - 1 && chars[i] === a && chars[i + 1] === b) {
        newChars.push(a + b); i += 2;
      } else { newChars.push(chars[i]); i += 1; }
    }
    chars = newChars;
    pairMap.clear();
    for (let j = 0; j < chars.length - 1; j++) {
      const p = chars[j] + ' ' + chars[j + 1];
      const rank = state.merges ? state.merges.get(p) : undefined;
      pairMap.set(j, { pair: p, rank: rank !== undefined ? rank : Infinity });
    }
  }
  return chars;
}

function tokenizeEncodeBpe(text) {
  const bpeStr = textToBpeStr(text);
  const pretokens = [];
  const pattern = state.pretokPattern;
  pattern.lastIndex = 0;
  let match;
  while ((match = pattern.exec(bpeStr)) !== null) pretokens.push(match[0]);
  if (pretokens.length === 0 && bpeStr.length > 0) pretokens.push(bpeStr);
  const allBpeTokens = [];
  for (const pt of pretokens) allBpeTokens.push(...bpeMerge(pt));
  const tokenIds = [];
  for (const tok of allBpeTokens) {
    const id = state.vocab[tok];
    if (id !== undefined) {
      tokenIds.push(id);
    } else {
      for (const ch of tok) {
        const chId = state.vocab[ch];
        if (chId !== undefined) tokenIds.push(chId);
      }
    }
  }
  return tokenIds;
}

/** 增强版 encode：added_tokens（特殊 token）先匹配、不被 BPE 拆分 */
function tokenizeEncodeFull(text) {
  if (!state.vocab || !state.merges) return [];
  if (!state.addedTokens || state.addedTokens.size === 0) return tokenizeEncodeBpe(text);
  const tokenList = [...state.addedTokens.keys()].sort((a, b) => b.length - a.length);
  const escapedTokens = tokenList.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const specialRe = new RegExp('(' + escapedTokens.join('|') + ')', 'g');
  const parts = text.split(specialRe);
  const allIds = [];
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) {
      if (parts[i].length > 0) allIds.push(...tokenizeEncodeBpe(parts[i]));
    } else {
      const info = state.addedTokens.get(parts[i]);
      if (info) allIds.push(info.id);
      else allIds.push(...tokenizeEncodeBpe(parts[i]));
    }
  }
  return allIds;
}

function tokenizeDecode(tokenIds) {
  if (!state.idToToken) return '';
  const byteArr = [];
  for (const id of tokenIds) {
    const tok = state.idToToken[id];
    if (tok === undefined) continue;
    // 检查是否为 added_tokens 表中的原始文本（非 BPE 编码）
    // 如 <|im_start|>、<|endoftext|> 等特殊 token 存储的是原始字符
    const addedInfo = state.addedTokens ? state.addedTokens.get(tok) : null;
    if (addedInfo && addedInfo.id === id) {
      // 直接按 UTF-8 编码输出原始文本，避免 byteDecoder 丢失非 ASCII 字符
      const rawBytes = textToBytes(tok);
      for (let j = 0; j < rawBytes.length; j++) byteArr.push(rawBytes[j]);
      continue;
    }
    // BPE token：每个字符映射回原始字节
    for (let i = 0; i < tok.length; i++) {
      const b = state.byteDecoder[tok[i]];
      if (b !== undefined) byteArr.push(b);
      // ★ 修复：非 BPE 字符（byteDecoder 返回 undefined）时回退 UTF-8 编码，不再静默丢弃
      else {
        const fb = textToBytes(tok[i]);
        for (let j = 0; j < fb.length; j++) byteArr.push(fb[j]);
      }
    }
  }
  return bytesToText(new Uint8Array(byteArr));
}

// ============================================================
// 内置 Chat Template Fallback（已知模型族）
// ============================================================
function buildFallbackChatTemplate(modelId) {
  const lower = modelId.toLowerCase();
  if (lower.includes('qwen') || lower.includes('chatml')) {
    return [
      "{%- for message in messages %}",
      "{{- '<|im_start|>' + message['role'] + '\n' + message['content'] + '<|im_end|>' + '\n' }}",
      "{%- endfor %}",
      "{%- if add_generation_prompt %}",
      "{{- '<|im_start|>assistant\n' }}",
      "{%- endif %}",
    ].join('');
  }
  if (lower.includes('deepseek')) {
    return [
      "{%- for message in messages %}",
      "{{- '<｜begin▁of▁sentence｜>' + message['role'] + '\n' + message['content'] + '<｜end▁of▁sentence｜>' + '\n' }}",
      "{%- endfor %}",
      "{%- if add_generation_prompt %}",
      "{{- '<｜begin▁of▁sentence｜>assistant\n' }}",
      "{%- endif %}",
    ].join('');
  }
  if (lower.includes('llama') || lower.includes('meta-llama')) {
    return [
      "{%- if messages[0]['role'] == 'system' %}",
      "{{- '<|start_header_id|>system<|end_header_id|>\n\n' + messages[0]['content'] + '<|eot_id|>' }}",
      "{%- set loop_messages = messages[1:] %}",
      "{%- else %}",
      "{%- set loop_messages = messages %}",
      "{%- endif %}",
      "{%- for message in loop_messages %}",
      "{%- if message['role'] == 'user' %}",
      "{{- '<|start_header_id|>user<|end_header_id|>\n\n' + message['content'] + '<|eot_id|>' }}",
      "{%- elif message['role'] == 'assistant' %}",
      "{{- '<|start_header_id|>assistant<|end_header_id|>\n\n' + message['content'] + '<|eot_id|>' }}",
      "{%- endif %}",
      "{%- endfor %}",
      "{%- if add_generation_prompt %}",
      "{{- '<|start_header_id|>assistant<|end_header_id|>\n\n' }}",
      "{%- endif %}",
    ].join('');
  }
  return null;
}

// ============================================================
// Chat Template 渲染（Nunjucks）
// ============================================================
function renderChatTemplate(messages, addGenerationPrompt) {
  if (!state.chatTemplate) throw new Error('Chat template 未加载。请先加载模型配置文件。');
  if (typeof state.chatTemplate !== 'string') throw new Error('Chat template 格式异常，不是字符串。类型: ' + typeof state.chatTemplate);
  if (typeof nunjucks === 'undefined') throw new Error('Nunjucks 库未加载。');
  if (!state._nunjucksReady) {
    nunjucks.configure({ autoescape: false, throwOnUndefined: false });
    state._nunjucksReady = true;
  }
  return nunjucks.renderString(state.chatTemplate, {
    messages: messages,
    add_generation_prompt: addGenerationPrompt,
    bos_token: state.bosToken || '',
    eos_token: state.eosToken || '',
  });
}

// ============================================================
// 文件加载器
// ============================================================
async function fetchFile(url) {
  const resp = await fetch(url, { headers: { 'Accept': 'application/json, */*' } });
  if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + resp.statusText);
  return resp;
}
async function loadFromHF(modelId, filename) {
  const url = 'https://huggingface.co/' + modelId + '/resolve/main/' + filename;
  const resp = await fetchFile(url);
  return filename.endsWith('.json') ? resp.json() : resp.text();
}
async function loadFromMS(modelId, filename) {
  const url = 'https://modelscope.cn/models/' + modelId + '/resolve/master/' + filename;
  const resp = await fetchFile(url);
  return filename.endsWith('.json') ? resp.json() : resp.text();
}
function loadFromLocal(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const text = reader.result.replace(/^\uFEFF/, '').trim();
        try { resolve(JSON.parse(text)); } catch (e) { resolve(text); }
      } catch (e) { reject(new Error('文件解析失败: ' + e.message)); }
    };
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.readAsText(file);
  });
}

// ============================================================
// 解析器
// ============================================================
function parseTokenizerJson(json) {
  const model = json.model;
  if (!model || !model.vocab) throw new Error('tokenizer.json 格式错误：缺少 model.vocab');
  state.vocab = model.vocab;
  state.idToToken = {};
  for (const [tok, id] of Object.entries(model.vocab)) state.idToToken[id] = tok;
  state.merges = new Map();
  state.mergeList = [];
  if (model.merges && Array.isArray(model.merges)) {
    model.merges.forEach((merge, idx) => {
      const parts = merge.split(' ');
      if (parts.length === 2) { state.merges.set(merge, idx); state.mergeList.push(parts); }
    });
  }
  state.addedTokens = new Map();
  state.specialTokenIds = new Set();
  if (json.added_tokens && Array.isArray(json.added_tokens)) {
    for (const t of json.added_tokens) {
      state.addedTokens.set(t.content, { id: t.id, special: t.special || false, single_word: t.single_word || false });
      if (t.special) state.specialTokenIds.add(t.id);
      // ★ 补齐 idToToken：确保 added_tokens 中的 ID 在解码时可被查找到
      if (!(t.id in state.idToToken)) state.idToToken[t.id] = t.content;
    }
  }
}
function parseTokenizerConfig(json) {
  if (json.chat_template) {
    state.chatTemplate = Array.isArray(json.chat_template) ? json.chat_template.join('') : String(json.chat_template);
  }
  if (json.bos_token) state.bosToken = typeof json.bos_token === 'string' ? json.bos_token : (json.bos_token.content || '');
  if (json.eos_token) state.eosToken = typeof json.eos_token === 'string' ? json.eos_token : (json.eos_token.content || '');
  if (json.added_tokens_decoder) {
    for (const [idStr, info] of Object.entries(json.added_tokens_decoder)) {
      const id = parseInt(idStr);
      if (!state.addedTokens.has(info.content)) {
        state.addedTokens.set(info.content, { id: id, special: info.special || false, single_word: false });
      }
      if (info.special) state.specialTokenIds.add(id);
      // ★ 补齐 idToToken：确保 added_tokens_decoder 中的 ID 在解码时可被查找到
      if (!(id in state.idToToken)) state.idToToken[id] = info.content;
    }
  }
}

// ============================================================
// 主加载流程
// ============================================================
async function loadTokenizer() {
  const sourceType = document.getElementById('sourceType').value;
  const modelPath = document.getElementById('modelPath').value.trim();
  if (!modelPath) { showToast('请输入模型路径/ID', 'error'); return; }

  const btnLoad = document.getElementById('btnLoad');
  setStatus('', '加载中...');
  btnLoad.disabled = true;
  btnLoad.textContent = '加载中...';

  try {
    let configError = null;
    let templateFromJinja = false;

    if (sourceType === 'local') {
      // ★ 修复：用户取消文件选择时正常 resolve，不再永久卡死"加载中"
      const cancelled = await loadFromLocalFiles();
      if (cancelled) {
        setStatus('', '就绪 — 已取消选择，请加载模型 Tokenizer');
        return;
      }
      document.getElementById('sourceType').value = 'local'; // 与拖拽行为一致
    } else {
      const loadFn = sourceType === 'huggingface' ? loadFromHF : loadFromMS;
      let tokenizerJson, configJson = null, jinjaText = null;
      const [tResult, cResult, jResult] = await Promise.allSettled([
        loadFn(modelPath, 'tokenizer.json'),
        loadFn(modelPath, 'tokenizer_config.json'),
        loadFn(modelPath, 'chat_template.jinja'),   // ★ 新增：GLM 等把模板放在独立 jinja 文件
      ]);
      if (tResult.status === 'fulfilled') tokenizerJson = tResult.value;
      else throw new Error('tokenizer.json 加载失败: ' + tResult.reason.message);
      if (cResult.status === 'fulfilled') configJson = cResult.value;
      else { configError = cResult.reason.message; console.warn('tokenizer_config.json 加载失败:', configError); }
      if (jResult.status === 'fulfilled') jinjaText = jResult.value;

      parseTokenizerJson(tokenizerJson);
      if (configJson) parseTokenizerConfig(configJson);
      if (!state.chatTemplate && typeof jinjaText === 'string' && jinjaText.trim()) {
        state.chatTemplate = jinjaText;
        templateFromJinja = true;
      }
    }

    state.tokenizerReady = true;
    state.sourceType = sourceType;
    state.modelPath = modelPath;
    const vocabSize = Object.keys(state.vocab).length.toLocaleString();

    if (!state.chatTemplate) {
      const fb = buildFallbackChatTemplate(modelPath);
      if (fb) { state.chatTemplate = fb; showToast('chat_template 通过内置模板自动补充', 'success'); }
    }

    const tmplTag = state.chatTemplate
      ? (templateFromJinja ? ' · 模板来自 chat_template.jinja' : '')
      : ' ⚠ 无 chat_template';
    setStatus('ok', '已加载: ' + modelPath + ' · vocab=' + vocabSize + tmplTag);

    runMessagesToPrompt();
    const extra = configError ? '（config 加载失败，chat_template 可能缺失）' : '';
    showToast('Tokenizer 加载成功 (' + vocabSize + ' tokens) ' + extra, configError ? 'error' : 'success');
  } catch (err) {
    setStatus('error', '加载失败: ' + err.message);
    showToast('加载失败: ' + err.message, 'error');
    console.error(err);
  } finally {
    btnLoad.disabled = false;
    btnLoad.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 加载';
  }
}

// ★ 修复：返回 true 表示用户取消选择（Promise 必定 settle，按钮不再卡死）
async function loadFromLocalFiles() {
  return new Promise((resolve, reject) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.accept = '.json,.jinja,.txt';
    input.onchange = async () => {
      const files = input.files;
      if (!files || files.length === 0) { resolve(true); return; }
      const fileMap = {};
      for (const f of files) fileMap[f.name] = f;
      if (!fileMap['tokenizer.json']) { reject(new Error('未找到 tokenizer.json 文件（可一并选择 tokenizer_config.json / chat_template.jinja）')); return; }
      try {
        parseTokenizerJson(await loadFromLocal(fileMap['tokenizer.json']));
        if (fileMap['tokenizer_config.json']) parseTokenizerConfig(await loadFromLocal(fileMap['tokenizer_config.json']));
        if (!state.chatTemplate && fileMap['chat_template.jinja']) {
          const jt = await loadFromLocal(fileMap['chat_template.jinja']);
          if (typeof jt === 'string' && jt.trim()) state.chatTemplate = jt;
        }
        resolve(false);
      } catch (err) { reject(err); }
    };
    input.click();
  });
}

// ============================================================
// UI 交互逻辑
// ============================================================
function getMessages() {
  try {
    const raw = document.getElementById('messagesEditor').value.trim();
    if (!raw) return [];
    return JSON.parse(raw);
  } catch (e) {
    showToast('Messages JSON 格式错误: ' + e.message, 'error');
    return null;
  }
}
function setPrompt(text) { document.getElementById('promptEditor').value = text; }
function getPrompt() { return document.getElementById('promptEditor').value; }

function runMessagesToPrompt() {
  const messages = getMessages();
  if (!messages || messages.length === 0) return;
  if (!state.chatTemplate) { setPrompt('[Chat template 未加载 — 请点击"加载"按钮]'); return; }
  try {
    setPrompt(renderChatTemplate(messages, true));
    runPromptToTokens();
  } catch (e) {
    setPrompt('[渲染错误] ' + e.message);
    showToast('Chat Template 渲染失败: ' + e.message, 'error');
  }
}

function runPromptToTokens() {
  if (!state.tokenizerReady) return;
  const prompt = getPrompt();
  const ids = prompt ? tokenizeEncodeFull(prompt) : [];
  state.currentTokenIds = ids;
  syncTokenPanel(ids, true);
}

// ★ 修复：Detokenize 直接读权威数据/编辑器，绝不从 chip 渲染文本反解析
function runTokensToPrompt() {
  if (!state.tokenizerReady) return;
  const ids = parseTokenIdsText(document.getElementById('tokenIdsEditor').value);
  state.currentTokenIds = ids;
  syncTokenPanel(ids, false);
  setPrompt(ids.length === 0 ? '' : tokenizeDecode(ids));
}

function runTokensToMessages() {
  runTokensToPrompt();
  runPromptToMessages();
}

function runPromptToMessages() {
  const prompt = getPrompt();
  if (!prompt) return;
  const messages = [];
  const chatmlRe = /<\|im_start\|>(\w+)\n([\s\S]*?)<\|im_end\|>/g;
  let match;
  while ((match = chatmlRe.exec(prompt)) !== null) {
    messages.push({ role: match[1], content: match[2].trim() });
  }
  if (messages.length > 0) {
    document.getElementById('messagesEditor').value = JSON.stringify(messages, null, 2);
    showToast('解析到 ' + messages.length + ' 条消息 (ChatML)', 'success');
    return;
  }
  const llamaRe = /\[INST\]\s*([\s\S]*?)\s*\[\/INST\]\s*([\s\S]*?)(?=\[INST\]|$)/g;
  while ((match = llamaRe.exec(prompt)) !== null) {
    if (match[1].trim()) messages.push({ role: 'user', content: match[1].trim() });
    if (match[2].trim()) messages.push({ role: 'assistant', content: match[2].trim() });
  }
  if (messages.length > 0) {
    document.getElementById('messagesEditor').value = JSON.stringify(messages, null, 2);
    showToast('解析到 ' + messages.length + ' 条消息 (LLaMA)', 'success');
    return;
  }
  showToast('无法自动解析 prompt → messages，请手动编辑', 'error');
}

// ===== Token 面板：可编辑 ID + 只读芯片 =====
function parseTokenIdsText(text) {
  if (!text || !text.trim()) return [];
  const nums = text.match(/-?\d+/g);
  if (!nums) return [];
  const out = [];
  for (const s of nums) {
    const n = parseInt(s, 10);
    if (Number.isFinite(n) && n >= 0) out.push(n);
  }
  return out;
}

function syncTokenPanel(ids, updateEditor) {
  document.getElementById('tokenCount').textContent = ids.length;
  if (updateEditor) {
    document.getElementById('tokenIdsEditor').value = ids.length ? ids.join(', ') : '';
  }
  renderChips(ids);
}

function renderChips(ids) {
  const container = document.getElementById('tokenChips');
  if (!ids.length) { container.innerHTML = '<div class="empty-state">无 token</div>'; return; }
  const groups = ['group-a', 'group-b', 'group-c', 'group-d'];
  const parts = [];
  for (let i = 0; i < ids.length; i++) {
    const id = ids[i];
    const tok = state.idToToken ? (state.idToToken[id] !== undefined ? state.idToToken[id] : '?') : '?';
    const isSpecial = state.specialTokenIds && state.specialTokenIds.has(id);
    const escapedTok = String(tok).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const visible = escapedTok
      .replace(/Ġ/g, '␣').replace(/Ċ/g, '↵').replace(/ĉ/g, '¶');
    parts.push(
      '<span class="token-chip' + (isSpecial ? ' special' : '') + ' ' + groups[Math.floor(i / 64) % 4] + '"' +
      ' title="ID: ' + id + ' | Token: ' + escapedTok + '">' +
      '<span class="token-id">' + id + '</span>' +
      '<span class="token-text">' + (visible === '' ? '∅' : visible) + '</span></span>'
    );
  }
  container.innerHTML = parts.join('');
}

  ], null, 2);

}

// ★ 快捷模型选择：预设自带正确来源，不再靠首字母猜测
document.getElementById('modelPreset').addEventListener('change', (e) => {
  const val = e.target.value;
  if (!val) return;
  let source, modelId;
  if (val.includes('|')) {
    const sep = val.indexOf('|');
    source = val.slice(0, sep) === 'hf' ? 'huggingface' : 'modelscope';
    modelId = val.slice(sep + 1);
  } else {
    modelId = val;
    const org = modelId.split('/')[0] || '';
    source = (org && org === org.toLowerCase()) ? 'modelscope' : 'huggingface';
  }
  const sourceSelect = document.getElementById('sourceType');
  sourceSelect.value = source;
  sourceSelect.dispatchEvent(new Event('change'));
  document.getElementById('modelPath').value = modelId;
  loadTokenizer();
  e.target.value = '';
});

  document.getElementById('dropOverlay').classList.add('active');
});

  const files = e.dataTransfer.files;
  const fileMap = {};
  for (const f of files) fileMap[f.name] = f;

  }
  document.getElementById('sourceType').value = 'local';
  setStatus('', '加载本地文件中...');
  try {
    parseTokenizerJson(await loadFromLocal(fileMap['tokenizer.json']));
    if (fileMap['tokenizer_config.json']) parseTokenizerConfig(await loadFromLocal(fileMap['tokenizer_config.json']));
    if (!state.chatTemplate && fileMap['chat_template.jinja']) {
      const jt = await loadFromLocal(fileMap['chat_template.jinja']);
      if (typeof jt === 'string' && jt.trim()) state.chatTemplate = jt;
    }
    state.tokenizerReady = true;
    state.sourceType = 'local';
    state.modelPath = fileMap['tokenizer.json'].name;
    const vocabSize = Object.keys(state.vocab).length.toLocaleString();
    setStatus('ok', '已加载: 本地文件 · vocab=' + vocabSize + (state.chatTemplate ? ' · 含 chat_template' : ''));
    runMessagesToPrompt();
    showToast('本地 Tokenizer 加载成功 (' + vocabSize + ' tokens)', 'success');
  } catch (err) {
    setStatus('error', '加载失败: ' + err.message);
    showToast('加载失败: ' + err.message, 'error');
    console.error(err);
  }
});
